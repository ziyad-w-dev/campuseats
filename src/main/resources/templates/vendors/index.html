<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vendors · CampusEats</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="page">
    <h1>CampusEats vendors</h1>
    <ul class="vendor-list">
        <li th:each="vendor : ${vendors}">
            <a th:href="@{/vendors/{id}/menu-items(id=${vendor.id})}" th:text="${vendor.name}">Vendor</a>
        </li>
    </ul>
</main>
</body>
</html>
